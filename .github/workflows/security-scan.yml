name: Security Scan

on:
  schedule:
    - cron: "0 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      TRIVY_PLATFORM: linux/${{ matrix.arch }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - id: trivy_gate
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.75.0
          image-ref: ghcr.io/inherent-design/cloudnative-pg-timescaledb:18
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln

      - id: trivy_report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.75.0
          image-ref: ghcr.io/inherent-design/cloudnative-pg-timescaledb:18
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          ignore-unfixed: true
          scanners: vuln

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always() && steps.trivy_report.outcome == 'success'
        with:
          sarif_file: trivy-results.sarif
          category: container-${{ matrix.arch }}

      - name: Security summary
        if: always()
        env:
          SCAN_PLATFORM: linux/${{ matrix.arch }}
          TRIVY_GATE_OUTCOME: ${{ steps.trivy_gate.outcome }}
          TRIVY_REPORT_OUTCOME: ${{ steps.trivy_report.outcome }}
        run: |
          set -euo pipefail

          {
            echo "## Security Scan Summary"
            echo "- Platform: \`${SCAN_PLATFORM}\`"
            echo "- Image: \`ghcr.io/inherent-design/cloudnative-pg-timescaledb:18\`"
            echo "- Trivy gate status: \`${TRIVY_GATE_OUTCOME}\`"
            echo "- Trivy SARIF status: \`${TRIVY_REPORT_OUTCOME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f trivy-results.sarif ]; then
            FINDING_COUNT=$(jq '[.runs[].results[]?] | length' trivy-results.sarif)
            echo "- Trivy findings: \`${FINDING_COUNT}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail on Trivy findings
        if: always() && steps.trivy_gate.outcome == 'failure'
        run: |
          echo "Trivy detected HIGH/CRITICAL findings in the published image." >&2
          exit 1
