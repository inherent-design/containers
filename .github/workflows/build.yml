name: Build cloudnative-pg-timescaledb

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: inherent-design/cloudnative-pg-timescaledb
  PG_MAJOR: "18"

jobs:
  validate:
    name: validate (${{ matrix.arch }})
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    outputs:
      release: ${{ steps.changes.outputs.release }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: blacksmith-4vcpu-ubuntu-2404
          - arch: arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: changes
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            relevant:
              - "cloudnative-pg-timescaledb/**"
              - ".github/workflows/**"
              - ".github/actionlint.yaml"
              - "artifacthub-repo.yml"
              - "renovate.json"
            release:
              - "cloudnative-pg-timescaledb/Dockerfile"
              - "cloudnative-pg-timescaledb/.dockerignore"
              - "artifacthub-repo.yml"

      - uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2
        with:
          cache-key: cloudnative-pg-timescaledb/${{ matrix.arch }}

      - id: image
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.relevant == 'true'
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2
        with:
          context: ./cloudnative-pg-timescaledb
          platforms: ${{ env.PLATFORM }}
          pull: true
          no-cache: true
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke-test
          build-args: |
            PG_MAJOR=${{ env.PG_MAJOR }}

      - name: Smoke test
        if: steps.image.outcome == 'success'
        run: |
          expected=$(sed -n 's/^ARG TIMESCALEDB_VERSION=//p' cloudnative-pg-timescaledb/Dockerfile)
          docker run --rm -i --platform "$PLATFORM" --entrypoint sh \
            -e PG_MAJOR -e TIMESCALEDB_VERSION="$expected" \
            "${IMAGE_NAME}:smoke-test" -s < cloudnative-pg-timescaledb/smoke-test.sh

      - name: Scan image gate
        id: trivy_gate
        if: always() && steps.image.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.75.0
          image-ref: ${{ env.IMAGE_NAME }}:smoke-test
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln

      - name: Generate Trivy SARIF
        id: trivy_report
        if: always() && steps.image.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.75.0
          image-ref: ${{ env.IMAGE_NAME }}:smoke-test
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          ignore-unfixed: true
          scanners: vuln

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always() && steps.trivy_report.outcome == 'success'
        with:
          sarif_file: trivy-results.sarif
          category: container-${{ matrix.arch }}

      - name: Validation summary
        if: always()
        env:
          IMAGE_RESULT: ${{ steps.image.outcome }}
          SCAN_RESULT: ${{ steps.trivy_gate.outcome }}
        run: |
          {
            echo "## $PLATFORM validation"
            echo "- Build: $IMAGE_RESULT"
            echo "- Vulnerability gate: $SCAN_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$IMAGE_RESULT" = success ]; then
            docker run --rm --entrypoint dpkg-query "${IMAGE_NAME}:smoke-test" \
              -W 'postgresql-18*' 'timescaledb*' >> "$GITHUB_STEP_SUMMARY"
            docker run --rm --entrypoint barman-cloud-backup "${IMAGE_NAME}:smoke-test" \
              --version >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail on Trivy findings
        if: always() && steps.trivy_gate.outcome == 'failure'
        run: exit 1

  # Stable required-check name; fail if either native validation failed or was cancelled.
  build:
    needs: validate
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      release: ${{ needs.validate.outputs.release }}
    steps:
      - env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success

  candidate:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.build.outputs.release == 'true')
    permissions:
      contents: read
      packages: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2
        with:
          cache-key: cloudnative-pg-timescaledb/publish
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.PG_MAJOR }}
            type=raw,value=${{ env.PG_MAJOR }}-build-${{ github.run_id }}-${{ github.run_attempt }}
            type=schedule,pattern=${{ env.PG_MAJOR }}-{{date 'YYYYMMDD'}}
            type=sha,prefix=${{ env.PG_MAJOR }}-
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/inherent-design/containers/main/cloudnative-pg-timescaledb/README.md
            io.artifacthub.package.logo-url=https://raw.githubusercontent.com/inherent-design/containers/main/cloudnative-pg-timescaledb/icon.png
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.category=database
            io.artifacthub.package.keywords=postgresql,timescaledb,pgvector,cnpg,cloudnative-pg
            io.artifacthub.package.maintainers=[{"name":"inherent-design","email":"mannie@inherent.design"}]
            org.opencontainers.image.title=cloudnative-pg-timescaledb
            org.opencontainers.image.vendor=inherent.design
            org.opencontainers.image.documentation=https://github.com/inherent-design/containers/tree/main/cloudnative-pg-timescaledb

      # Upload without release tags, then validate this exact multiarch digest.
      - id: candidate
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2
        with:
          context: ./cloudnative-pg-timescaledb
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PG_MAJOR=${{ env.PG_MAJOR }}
          provenance: mode=max
          sbom: true

  verify-candidate:
    needs: candidate
    name: verify release (${{ matrix.arch }})
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: blacksmith-4vcpu-ubuntu-2404
          - arch: arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CANDIDATE_IMAGE: ghcr.io/inherent-design/cloudnative-pg-timescaledb@${{ needs.candidate.outputs.digest }}
      PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate the release digest
        run: |
          expected=$(sed -n 's/^ARG TIMESCALEDB_VERSION=//p' cloudnative-pg-timescaledb/Dockerfile)
          docker pull --platform "$PLATFORM" "$CANDIDATE_IMAGE"
          docker run --rm -i --platform "$PLATFORM" --entrypoint sh \
            -e PG_MAJOR -e TIMESCALEDB_VERSION="$expected" \
            "$CANDIDATE_IMAGE" -s < cloudnative-pg-timescaledb/smoke-test.sh
      - name: Scan release digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: ${{ env.PLATFORM }}
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.75.0
          image-ref: ${{ env.CANDIDATE_IMAGE }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln

  publish:
    needs: [candidate, verify-candidate]
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.candidate.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign
          cosign-release: v3.1.3

      - name: Sign image
        env:
          CANDIDATE_IMAGE: ghcr.io/inherent-design/cloudnative-pg-timescaledb@${{ needs.candidate.outputs.digest }}
        run: cosign sign --yes "$CANDIDATE_IMAGE"

      - name: Promote the validated digest
        env:
          CANDIDATE_IMAGE: ghcr.io/inherent-design/cloudnative-pg-timescaledb@${{ needs.candidate.outputs.digest }}
          RELEASE_TAGS: ${{ needs.candidate.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$RELEASE_TAGS"
          docker buildx imagetools create "${args[@]}" "$CANDIDATE_IMAGE"
          {
            echo "## Published Image"
            echo "- Validated digest: $CANDIDATE_IMAGE"
            echo "- Platforms: linux/amd64, linux/arm64"
            printf '%s\n' "$RELEASE_TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2
        with:
          # renovate: datasource=github-releases depName=oras-project/oras
          version: 1.3.4

      - name: Push Artifact Hub metadata
        run: |
          oras push "${REGISTRY}/${IMAGE_NAME}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
