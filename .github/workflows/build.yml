name: Build cloudnative-pg-timescaledb

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  packages: write
  security-events: write
  attestations: write
  artifact-metadata: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: inherent-design/cloudnative-pg-timescaledb
  PG_MAJOR: "18"

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - id: changes
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - "cloudnative-pg-timescaledb/**"
              - ".github/workflows/**"
              - ".github/actionlint.yaml"
              - "artifacthub-repo.yml"
              - "renovate.json"

      - uses: docker/setup-qemu-action@v4

      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: cloudnative-pg-timescaledb/Dockerfile

      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.PG_MAJOR }}
            type=schedule,pattern=${{ env.PG_MAJOR }}-{{date 'YYYYMMDD'}}
            type=sha,prefix=${{ env.PG_MAJOR }}-
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/inherent-design/containers/main/cloudnative-pg-timescaledb/README.md
            io.artifacthub.package.logo-url=https://raw.githubusercontent.com/inherent-design/containers/main/cloudnative-pg-timescaledb/icon.png
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.category=database
            io.artifacthub.package.keywords=postgresql,timescaledb,pgvector,cnpg,cloudnative-pg
            io.artifacthub.package.maintainers=[{"name":"inherent-design","email":"mannie@inherent.design"}]
            org.opencontainers.image.title=cloudnative-pg-timescaledb
            org.opencontainers.image.vendor=inherent.design
            org.opencontainers.image.documentation=https://github.com/inherent-design/containers/tree/main/cloudnative-pg-timescaledb

      - id: build-test
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.relevant == 'true'
        uses: useblacksmith/build-push-action@v2
        with:
          context: ./cloudnative-pg-timescaledb
          platforms: linux/amd64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke-test
          build-args: |
            PG_MAJOR=${{ env.PG_MAJOR }}

      - id: build-test-arm64
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.relevant == 'true'
        uses: useblacksmith/build-push-action@v2
        with:
          context: ./cloudnative-pg-timescaledb
          platforms: linux/arm64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke-test-arm64
          build-args: |
            PG_MAJOR=${{ env.PG_MAJOR }}

      - name: Smoke test both architectures
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.relevant == 'true'
        run: |
          expected=$(sed -n 's/^ARG TIMESCALEDB_VERSION=//p' cloudnative-pg-timescaledb/Dockerfile)
          for arch in amd64 arm64; do
            tag=smoke-test
            if [ "$arch" = arm64 ]; then tag=smoke-test-arm64; fi
            docker run --rm -i --platform "linux/$arch" --entrypoint sh \
              -e PG_MAJOR -e TIMESCALEDB_VERSION="$expected" \
              "${IMAGE_NAME}:$tag" -s < cloudnative-pg-timescaledb/smoke-test.sh
          done

      - name: Scan image gate
        id: trivy_gate
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.relevant == 'true'
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.36.0
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.74.0
          image-ref: ${{ env.IMAGE_NAME }}:smoke-test
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln

      - name: Generate Trivy SARIF
        id: trivy_report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.relevant == 'true'
        uses: aquasecurity/trivy-action@0.36.0
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.74.0
          image-ref: ${{ env.IMAGE_NAME }}:smoke-test
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          ignore-unfixed: true
          scanners: vuln

      - uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.trivy_report.outcome == 'success'
        with:
          sarif_file: trivy-results.sarif
          category: container-amd64

      - name: Scan arm64 image gate
        id: trivy_gate_arm64
        if: always() && steps.build-test-arm64.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.36.0
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.74.0
          image-ref: ${{ env.IMAGE_NAME }}:smoke-test-arm64
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln

      - name: Generate arm64 Trivy SARIF
        id: trivy_report_arm64
        if: always() && steps.build-test-arm64.outcome == 'success'
        uses: aquasecurity/trivy-action@0.36.0
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.74.0
          image-ref: ${{ env.IMAGE_NAME }}:smoke-test-arm64
          format: sarif
          output: trivy-results-arm64.sarif
          exit-code: "0"
          ignore-unfixed: true
          scanners: vuln

      - uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.trivy_report_arm64.outcome == 'success'
        with:
          sarif_file: trivy-results-arm64.sarif
          category: container-arm64

      - name: Validation summary
        if: always()
        env:
          BUILD_TEST_OUTCOME: ${{ steps.build-test.outcome }}
          TRIVY_ARM64_OUTCOME: ${{ steps.trivy_gate_arm64.outcome }}
          TRIVY_GATE_OUTCOME: ${{ steps.trivy_gate.outcome }}
          TRIVY_REPORT_OUTCOME: ${{ steps.trivy_report.outcome }}
          RELEVANT_CHANGES: ${{ steps.changes.outputs.relevant }}
        run: |
          set -euo pipefail

          CNPG_TAG=$(sed -n 's/^ARG CNPG_TAG=//p' cloudnative-pg-timescaledb/Dockerfile)
          REQUESTED_TS=$(sed -n 's/^ARG TIMESCALEDB_VERSION=//p' cloudnative-pg-timescaledb/Dockerfile)

          {
            echo "## Validation Summary"
            echo "- Requested CNPG base tag: \`${CNPG_TAG}\`"
            echo "- Requested TimescaleDB version: \`${REQUESTED_TS}\`"
            echo "- Relevant changes detected: \`${RELEVANT_CHANGES:-true}\`"
            echo "- ARM64 Trivy gate: \`${TRIVY_ARM64_OUTCOME}\`"
            echo "- Smoke image build: \`${BUILD_TEST_OUTCOME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${BUILD_TEST_OUTCOME}" = "success" ]; then
            docker run --rm --entrypoint sh "${IMAGE_NAME}:smoke-test" -c '
              pkg="timescaledb-2-postgresql-18"
              printf "resolved_ts=%s\n" "$(dpkg-query -W -f='\''${Version}'\'' "$pkg")"
              printf "default_ts=%s\n" "$(grep default_version /usr/share/postgresql/18/extension/timescaledb.control | cut -d= -f2 | tr -d " '\''")"
              for ext in vector pgaudit; do
                if [ -f "/usr/share/postgresql/18/extension/${ext}.control" ]; then
                  printf "%s_status=present\n" "$ext"
                else
                  printf "%s_status=missing\n" "$ext"
                fi
              done
              missing=""
              for bin in barman-cloud-backup barman-cloud-wal-archive barman-cloud-check-wal-archive barman-cloud-wal-restore barman-cloud-restore; do
                if ! command -v "$bin" >/dev/null 2>&1; then
                  missing="${missing}${bin} "
                fi
              done
              if [ -n "$missing" ]; then
                printf "barman_status=missing:%s\n" "$missing"
              else
                printf "barman_status=present\n"
              fi
            ' > /tmp/image-metadata

            # shellcheck disable=SC1091
            . /tmp/image-metadata
            {
              echo "- Resolved TimescaleDB package: \`${resolved_ts}\`"
              echo "- TimescaleDB extension default: \`${default_ts}\`"
              echo "- pgVector control file: \`${vector_status}\`"
              echo "- PGAudit control file: \`${pgaudit_status}\`"
              echo "- Barman toolchain: \`${barman_status}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f trivy-results.sarif ]; then
            FINDING_COUNT=$(jq '[.runs[].results[]?] | length' trivy-results.sarif)
            {
              echo "- Trivy gate status: \`${TRIVY_GATE_OUTCOME}\`"
              echo "- Trivy SARIF status: \`${TRIVY_REPORT_OUTCOME}\`"
              echo "- Trivy findings: \`${FINDING_COUNT}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "- Trivy gate status: \`${TRIVY_GATE_OUTCOME:-not-run}\`"
              echo "- Trivy SARIF status: \`${TRIVY_REPORT_OUTCOME:-not-run}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail on Trivy findings
        if: always() && (steps.trivy_gate.outcome == 'failure' || steps.trivy_gate_arm64.outcome == 'failure')
        run: |
          echo "Trivy detected HIGH/CRITICAL findings in the smoke-test image." >&2
          exit 1

      - id: push
        uses: useblacksmith/build-push-action@v2
        if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.relevant == 'true')
        with:
          context: ./cloudnative-pg-timescaledb
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PG_MAJOR=${{ env.PG_MAJOR }}
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@v4
        if: steps.push.outcome == 'success'
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@v4.1.2
        if: steps.push.outcome == 'success'

      - name: Sign image
        if: steps.push.outcome == 'success'
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

      - name: Publish summary
        if: steps.push.outcome == 'success'
        env:
          PUSHED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Published Image"
            echo "- Digest: ${{ steps.push.outputs.digest }}"
            echo "- Platforms: linux/amd64, linux/arm64"
            echo "- Tags:"
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "  - \`$tag\`"
            done <<< "${PUSHED_TAGS}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: oras-project/setup-oras@v2
        if: steps.push.outcome == 'success'

      - name: Push Artifact Hub metadata
        if: steps.push.outcome == 'success'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
          oras push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
