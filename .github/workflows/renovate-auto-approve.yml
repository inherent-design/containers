name: Renovate Auto Approve

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    # Enable only after configuring required checks and Actions approval permissions.
    if: vars.RENOVATE_AUTO_APPROVE == 'true' && github.event.pull_request.user.login == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = new Set(pr.labels.map((label) => label.name));
            const eligible =
              !pr.draft &&
              labels.has('safe-automerge') &&
              !labels.has('major') &&
              !labels.has('needs-review');

            await core.summary
              .addHeading('Renovate auto-approval')
              .addRaw(`PR #${pr.number} eligible: ${eligible ? 'yes' : 'no'}`)
              .write();

            if (!eligible) {
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const alreadyApproved = reviews.some(
              (review) => review.user?.login === 'github-actions[bot]' && review.state === 'APPROVED' && review.commit_id === pr.head.sha
            );

            if (alreadyApproved) {
              return;
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              commit_id: pr.head.sha,
              event: 'APPROVE',
              body: 'Approving safe Renovate update after automated policy checks.',
            });
